:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#0b0b0b;--paper:#FBFAF6;--w:430px}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--ink);color:#000;font-family:'Space Mono',ui-monospace,Menlo,monospace;line-height:1.35}

button:focus-visible,input:focus-visible{outline:3px solid #7a7a7a;outline-offset:2px}

header.hl{justify-content:center;gap:12px;min-height:96px}
header h1,header h2{font:900 42px/1 'Londrina Solid',sans-serif;text-transform:uppercase;letter-spacing:.04em;margin:0;filter:url(#rg)}
header h2{font-size:28px;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk{color:#fff;font:700 13px 'Space Mono',monospace;padding:10px 2px;min-width:64px}
.lk.r{text-align:right}

ul{list-style:none;margin:0;padding:0 16px}
li+li{margin-top:14px}
.item{width:100%;text-align:left;background:var(--paper);border:3px solid #000;outline:1px solid #000;outline-offset:-8px;padding:12px 18px;display:block;color:#000}
.item b{font:900 26px/1 'Londrina Solid',sans-serif;text-transform:uppercase}
.item .meta{font-size:12px;margin:5px 0 6px}
.item .nt{font:700 14px 'Space Mono',monospace;letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fab{position:fixed;right:calc((100vw - min(100vw,var(--w)))/2 + 24px);bottom:calc(24px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:#000;color:#fff;font:900 40px/1 'Londrina Solid',sans-serif;box-shadow:0 0 0 3px #fff,0 0 0 5px #000;z-index:6}
.empty{padding:40px 24px;text-align:center}
.top{display:flex;align-items:center;justify-content:space-between;padding:0 16px 12px}
.top span{font:900 34px/1 'Londrina Solid',sans-serif}
.tg{padding:5px 14px;border:3px solid #000;background:#fff;font:900 19px/1 'Londrina Solid',sans-serif;text-transform:uppercase;color:#000}
.tg[aria-pressed=true]{background:#000;color:#fff}
.board{display:flex;flex-direction:column;gap:8px;margin:0 16px}
.bw{border:3px solid #000;background:#fff;overflow:hidden}
.beat{display:grid}
.sc{display:block;width:100%;background:#fff;border-bottom:3px solid #000}
.sc .sl{stroke:#000;stroke-width:1.5;opacity:.55}.sc .st{stroke:#000;stroke-width:1.6}.sc .bm{fill:#000}.sc .nh{fill:#000}.sc .ac,.sc .gh{fill:none;stroke:#000;stroke-width:1.5}.sc .pg{fill:#0000002e;opacity:0}.sc .pg.on{opacity:1}.sc text{fill:#000;font:italic 700 12px Georgia,serif;text-anchor:middle}
.step{--c:#000;--bg:#fff;display:flex;flex-direction:column;align-items:center;padding:3px 0 6px;background:none;width:100%;color:var(--c)}
.step+.step{border-left:1px solid #0002}
.step.on{--c:#fff;--bg:#000;background:#000}
.step.sel{box-shadow:inset 0 0 0 3px #000}
.lane{height:34px;display:flex;align-items:center;justify-content:center;gap:4px;width:100%}
.lane+.lane{border-top:2px dotted #0006}
.step.on .lane+.lane{border-color:#fff8}
.dot{border-radius:50%;display:block;flex:none;background:var(--c)}
.dot.e{border:2px solid var(--c);background:repeating-linear-gradient(135deg,var(--c) 0 1.5px,var(--bg) 1.5px 3px)}
.dot.a{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--c);margin:0 3px}
.dot.g,.dot.e.g{background:none;border:2px solid var(--c)}
.step.on .dot{transform:scale(1.12)}
.ch{font:700 1.05rem/1 'Space Mono',monospace;margin-top:4px;white-space:nowrap;color:var(--c)}
.rollbar{display:block;height:14px;width:calc(100% - 16px);border:2px solid var(--c);border-radius:3px;background:repeating-linear-gradient(115deg,var(--c) 0 3px,var(--bg) 3px 7px)}
.rollbar.e{border-style:dashed}.rollbar.a{height:24px;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--c)}.rollbar.g{opacity:.5}
.ctl{padding:20px 16px 0;display:grid;gap:16px}
.play{background:#000;color:#fff;font:900 30px/1 'Londrina Solid',sans-serif;text-transform:uppercase;letter-spacing:.06em;padding:16px;width:100%;outline:2px solid #000;outline-offset:3px}
.row{display:grid;grid-template-columns:92px 1fr 66px;align-items:center;gap:8px;font-size:13px;font-weight:700}
.row output{text-align:right}
input[type=range]{width:100%;accent-color:#000;height:32px}
.fld{padding:0 16px 14px}
.fld>label,.lbl{display:block;font-weight:700;margin-bottom:6px;font-size:.9rem}
input[type=text]{width:100%;font:700 1.1rem 'Space Mono',monospace;padding:12px 14px;border:3px solid #000;border-radius:0;background:#fff;color:#000}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.seg button{flex:1 1 auto;min-width:56px;padding:11px 12px;border:2px solid #000;background:#fff;font-weight:700;color:#000}
.seg button[aria-pressed=true]{background:#000;color:#fff}
.hint{font-size:.85rem;padding:10px 16px 0}
.del{color:#000;font-weight:700;text-decoration:underline;margin:22px auto 0;display:block;padding:12px}
.scrim{position:fixed;inset:0;background:#000a;z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;background:var(--paper);border:3px solid #000;border-bottom:0;z-index:21;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 12px;font:900 24px/1 'Londrina Solid',sans-serif;text-transform:uppercase}
.done{background:#000;color:#fff;font:900 24px/1 'Londrina Solid',sans-serif;text-transform:uppercase;padding:14px;width:100%}
@media (min-width:760px){
:root{--w:1120px}
header{margin:0 18px;padding:22px 6px 14px}
header.hl{min-height:112px}
header h1{font-size:54px}
header h2{font-size:34px}
.lk{font-size:15px}
.cl{margin:0 18px;padding:26px 0 56px;min-height:calc(100dvh - 150px)}
.cl.hm{min-height:max(calc(100dvh - 150px),700px)}
ul{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;padding:0 28px}
li+li{margin-top:0}
.item:hover{box-shadow:5px 5px 0 #000}
.top{padding:0 28px 16px}
.top span{font-size:40px}
.board{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));margin:0 28px;gap:12px}
.ctl{grid-template-columns:200px 1fr 1fr;align-items:center;gap:28px;padding:30px 28px 0}
.row{grid-template-columns:auto 1fr 70px}
.fld{padding:0 28px 18px}
.fld input[type=text]{max-width:520px}
.hint{padding:12px 28px 0}
.sheet{top:50%;bottom:auto;left:50%;right:auto;transform:translate(-50%,-50%);width:min(480px,calc(100% - 40px));margin:0;border-bottom:3px solid #000}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="rg" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter></svg><div id="app"></div>
<script>
(function(){
var KEY='cg.levadas.v1',VK='cg.vol';
var app=document.getElementById('app');
var BASE={a:[24,17,13],n:[14,11,9],g:[12,9,7]};
var METERS=['2/4','3/4','4/4','5/4','6/8','7/8','9/8','12/8'];

function geo(m){var p=m.split('/').map(Number),a=p[0],b=p[1];return{n:b===4?a*4:a*2,g:(b===8&&a%3===0)?6:4}}
function tpl(m,old){var n=geo(m).n,o=[];for(var i=0;i<n;i++)o.push(old&&old[i]?old[i]:{h:i%2?'e':'d',t:'n',r:1});return o}
function fromText(s){return s.replace(/\s/g,'').split('').map(function(c){return{h:c.toLowerCase(),t:c===c.toLowerCase()?'n':'a',r:1}})}
function seed(){return[{id:1,name:'Afoxé do Walter',m:'4/4',bpm:80,steps:fromText('DedE Dede dEdE Dede')}]}
function load(){try{var x=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(x)&&x.length)return x}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(L))}catch(e){}}
var L=load(),vol=0.8;
try{var v=parseFloat(localStorage.getItem(VK));if(v>=0&&v<=1)vol=v}catch(e){}
var view={n:'list'};

function lab(s){var c=s.t==='a'?s.h.toUpperCase():s.h,r='';if(s.z){for(var q=0;q<s.z;q++)r+='~';r=c+r}else for(var i=0;i<s.r;i++)r+=c;return s.t==='g'?'('+r+')':r}
function notation(st,m){var g=geo(m).g,o='';st.forEach(function(s,i){if(i&&i%g===0)o+=' ';if(!s.c)o+=lab(s)});return o}
function dots(s){if(s.z)return'<span class="rollbar '+s.h+' '+s.t+'"></span>';var o='',sz=BASE[s.t][s.r-1];for(var i=0;i<s.r;i++)o+='<span class="dot '+s.h+' '+s.t+'" style="width:'+sz+'px;height:'+sz+'px"></span>';return o}
function board(st,m,edit,sc){
  var g=geo(m).g,h='<div class="board" id="board">';
  for(var b=0;b<st.length;b+=g){
    var k=Math.min(g,st.length-b);
    h+='<div class="bw" style="--k:'+k+'">'+(sc?scoreBeat(st,b,k):'')+'<div class="beat" style="grid-template-columns:repeat('+k+',1fr)">';
    for(var i=b;i<b+k;i++){
      var s=st[i];if(s.c)continue;var cls='step'+(edit&&view.sel===i?' sel':'');
      h+='<'+(edit?'button data-a="note" data-i="'+i+'" aria-label="Nota '+(i+1)+': '+lab(s)+'"':'div')+' class="'+cls+'" data-s="'+i+'"'+(s.z?' style="grid-column:span '+s.z+'"':'')+'>'+
        '<span class="lane">'+(s.h==='d'?dots(s):'')+'</span><span class="lane">'+(s.h==='e'?dots(s):'')+'</span>'+
        '<span class="ch '+s.h+'">'+lab(s)+'</span></'+(edit?'button':'div')+'>';
    }
    h+='</div></div>';
  }
  return h+'</div>';
}

function dflt(i){return{h:i%2?'e':'d',t:'n',r:1}}
function norm(st,g){var cv=0;for(var i=0;i<st.length;i++){var s=st[i];if(cv>0){if(!s.c)st[i]={c:1,h:s.h,t:'n',r:1};cv--;continue}if(s.c){st[i]=dflt(i);continue}if(s.z){s.z=Math.min(s.z,g-(i%g),st.length-i);cv=s.z-1}}}
function durOpts(i){var g=geo(view.d.m).g,mx=Math.min(g-(i%g),view.d.steps.length-i),o=[];for(var q=1;q<=mx;q++)o.push([q,String(q)]);return o}
function scoreBeat(st,b,k){
  var W=240/k,Y=62,T=28,o='<svg class="sc" viewBox="0 0 240 86" aria-hidden="true">',N=[],i,q,s,x,FL={1:2,2:1,3:1,4:0,5:0,6:0};
  for(i=b;i<b+k;i++){s=st[i];if(s.c)continue;o+='<rect class="pg" data-p="'+i+'" x="'+((i-b)*W)+'" y="0" width="'+((s.z||1)*W)+'" height="86"/>'}
  o+='<line class="sl" x1="0" x2="240" y1="'+Y+'" y2="'+Y+'"/>';
  function head(x,s,first){var r='<ellipse class="nh '+s.h+'" cx="'+x+'" cy="'+Y+'" rx="6.4" ry="4.6" transform="rotate(-20 '+x+' '+Y+')"/>';
    if(s.t==='a'&&first)r+='<path class="ac" d="M'+(x-6)+' 5L'+(x+6)+' 10L'+(x-6)+' 15"/>';
    if(s.t==='g')r+='<path class="gh" d="M'+(x-10)+' '+(Y-6)+'q-5 6 0 12M'+(x+10)+' '+(Y-6)+'q5 6 0 12"/>';
    return r+'<line class="st" x1="'+(x+6)+'" x2="'+(x+6)+'" y1="'+(Y-1)+'" y2="'+T+'"/>'}
  function flag(x,n){var r='';for(var f=0;f<n;f++)r+='<path class="st" fill="none" d="M'+(x+6)+' '+(T+f*7)+'q9 5 6 15"/>';return r}
  for(i=b;i<b+k;i++){s=st[i];if(s.c)continue;
    if(s.z){x=(i-b+.5)*W;o+=head(x,s,1)+flag(x,FL[s.z]||0);
      if(s.z===3||s.z===6)o+='<circle class="bm" cx="'+(x+13)+'" cy="'+(Y+4)+'" r="1.8"/>';
      for(q=0;q<3;q++)o+='<line class="st" x1="'+(x+1)+'" x2="'+(x+11)+'" y1="'+(T+12+q*6)+'" y2="'+(T+5+q*6)+'"/>';
      N.push(null)}
    else{for(q=0;q<s.r;q++){x=(i-b+(q+.5)/s.r)*W;o+=head(x,s,q===0);N.push({x:x+6,l:s.r>1?3:2})}
      if(s.r===3)o+='<text x="'+((i-b+.5)*W)+'" y="22">3</text>'}}
  var run=[];
  function flush(){if(run.length>1){var a=run[0].x-.8,w=run[run.length-1].x-run[0].x+1.6;o+='<rect class="bm" x="'+a+'" y="'+T+'" width="'+w+'" height="3.6"/><rect class="bm" x="'+a+'" y="'+(T+6)+'" width="'+w+'" height="3.6"/>';
    for(var j=0;j<run.length-1;j++)if(run[j].l===3&&run[j+1].l===3)o+='<rect class="bm" x="'+(run[j].x-.8)+'" y="'+(T+12)+'" width="'+(run[j+1].x-run[j].x+1.6)+'" height="3.6"/>'}
    else if(run.length===1)o+=flag(run[0].x-6,run[0].l);run=[]}
  N.forEach(function(n){if(n)run.push(n);else flush()});flush();
  if(b+k===st.length)o+='<line class="st" x1="238" x2="238" y1="'+(Y-14)+'" y2="'+(Y+14)+'" style="stroke-width:3"/>';
  return o+'</svg>'}
function fit(){var b=document.getElementById('board');if(!b)return;var bw=b.querySelectorAll('.bw'),n=bw.length;if(!n)return;
  var mx=0;bw.forEach(function(e){mx=Math.max(mx,parseInt(e.style.getPropertyValue('--k'))||4)});
  var W=b.clientWidth,c=n;for(var r=1;r<=n;r++){c=Math.ceil(n/r);if(c*mx*46+(c-1)*12<=W)break}
  b.style.setProperty('--cols',c)}
window.addEventListener('resize',fit);
var STAR='<svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1l3.1 7.4 8 .7-6.1 5.2 1.9 7.8L12 18l-6.9 4.1 1.9-7.8L.9 9.1l8-.7z" fill="#fff"/></svg>';
function render(){
  var h='';
  if(view.n==='list'){
    h='<header class="hl">'+STAR+'<h1>Levadas</h1>'+STAR+'</header>';
    h+=L.length?'<ul>'+L.map(function(x){return'<li><button class="item" data-a="open" data-id="'+x.id+'"><b>'+esc(x.name)+'</b><div class="meta">'+x.m+' · '+x.bpm+' BPM</div><div class="nt">'+notation(x.steps,x.m)+'</div></button></li>'}).join('')+'</ul>':'<p class="empty">Nenhuma levada ainda. Toque em + para criar.</p>';h+='<button class="fab" data-a="new" aria-label="Nova levada">+</button>';
  }else if(view.n==='play'){
    var x=cur();
    h='<header><button class="lk" data-a="back">‹ Levadas</button><h2>'+esc(x.name)+'</h2><button class="lk r" data-a="edit">Editar</button></header>'+
      '<div class="top"><span>'+x.m+'</span><button class="tg" data-a="score" aria-pressed="'+!!x.sc+'">Partitura</button></div>'+board(x.steps,x.m,false,x.sc)+
      '<div class="ctl"><button class="play" id="pl" data-a="toggle">'+(playing?'Parar':'Tocar')+'</button>'+
      '<div class="row"><label for="bpm">Andamento</label><input id="bpm" type="range" min="40" max="200" value="'+x.bpm+'"><output id="bv">'+x.bpm+' BPM</output></div>'+
      '<div class="row"><label for="vol">Volume</label><input id="vol" type="range" min="0" max="100" value="'+Math.round(vol*100)+'"><output id="vv">'+Math.round(vol*100)+'%</output></div></div>';
  }else{
    var d=view.d;
    h='<header><button class="lk" data-a="cancel">Cancelar</button><h2>'+(d.id?'Editar levada':'Nova levada')+'</h2><button class="lk r" data-a="save">Salvar</button></header>'+
      '<div class="fld"><label for="nm">Nome</label><input id="nm" type="text" value="'+esc(d.name)+'"></div>'+
      '<div class="fld"><span class="lbl">Compasso</span><div class="seg" style="margin:0">'+METERS.map(function(m){return'<button data-a="meter" data-m="'+m+'" aria-pressed="'+(d.m===m)+'">'+m+'</button>'}).join('')+'</div></div>'+
      board(d.steps,d.m,true)+'<p class="hint">Toque numa nota para mudar mão, tipo ou toques.</p>'+
      (d.id?'<button class="del" data-a="del">'+(view.cd?'Toque de novo para excluir':'Excluir levada')+'</button>':'');
    if(view.sel!=null){
      var s=d.steps[view.sel];
      h+='<div class="scrim" data-a="close"></div><div class="sheet" role="dialog" aria-label="Editar nota"><h3>Nota '+(view.sel+1)+'</h3>'+
        seg('Mão','h',s.h,[['d','Direita'],['e','Esquerda']])+seg('Tipo','t',s.t,[['a','Acento'],['n','Normal'],['g','Ghost']])+
        seg('Toques','r',s.z?'z':s.r,[[1,'Simples'],[2,'Dupleto'],[3,'Tripleto'],['z','Rufo']])+(s.z?seg('Duração do rufo (semicolcheias)','z',s.z,durOpts(view.sel)):'')+'<button class="done" data-a="close">Pronto</button></div>';
    }
  }
  var ix=h.indexOf('<div class="scrim"'),bd=ix<0?h:h.slice(0,ix),tl=ix<0?'':h.slice(ix);
  app.innerHTML=bd.replace('</header>','</header><div class="cl'+(view.n==='list'?' hm':'')+'">')+'</div>'+tl;fit();
  var nm=document.getElementById('nm');if(nm)nm.addEventListener('input',function(){view.d.name=nm.value});
  var b=document.getElementById('bpm');if(b)b.addEventListener('input',function(){var x=cur();x.bpm=+b.value;document.getElementById('bv').textContent=b.value+' BPM'});
  if(b)b.addEventListener('change',save);
  var vo=document.getElementById('vol');if(vo)vo.addEventListener('input',function(){vol=vo.value/100;document.getElementById('vv').textContent=vo.value+'%';if(master)master.gain.value=vol*vol;try{localStorage.setItem(VK,vol)}catch(e){}});
}
function seg(t,k,v,o){return'<span class="lbl">'+t+'</span><div class="seg">'+o.map(function(p){return'<button data-a="set" data-k="'+k+'" data-v="'+p[0]+'" aria-pressed="'+(p[0]===v)+'">'+p[1]+'</button>'}).join('')+'</div>'}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function cur(){return L.filter(function(x){return x.id===view.id})[0]}

/* ---------- áudio ---------- */
var ctx=null,noise=null,master=null,playing=false,step=0,nextT=0,timer=null,queue=[],raf=0,lastOn=null;
function init(){
  if(!ctx){
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    master=ctx.createGain();master.gain.value=vol*vol;master.connect(ctx.destination);
    var n=ctx.sampleRate*0.3,b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);
    for(var i=0;i<n;i++)d[i]=Math.random()*2-1;noise=b;
  }
  if(ctx.state!=='running')ctx.resume();
}
function hit(h,type,t){
  var v=type==='a'?1:type==='g'?0.12:type==='r'?0.26:0.36,dec=type==='a'?0.16:type==='r'?0.06:0.085;
  var out=ctx.createGain();out.gain.value=0.9;
  if(ctx.createStereoPanner){var p=ctx.createStereoPanner();p.pan.value=h==='d'?0.3:-0.3;out.connect(p);p.connect(master)}else out.connect(master);
  var s=ctx.createBufferSource();s.buffer=noise;
  var hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=1500;
  var g=ctx.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+dec);
  s.connect(hp);hp.connect(g);g.connect(out);s.start(t);s.stop(t+dec+0.02);
  var o=ctx.createOscillator();o.type='triangle';o.frequency.setValueAtTime(type==='a'?230:200,t);o.frequency.exponentialRampToValueAtTime(150,t+0.05);
  var og=ctx.createGain();og.gain.setValueAtTime(v*0.55,t);og.gain.exponentialRampToValueAtTime(0.001,t+0.07);
  o.connect(og);og.connect(out);o.start(t);o.stop(t+0.09);
}
function tick(){
  var x=cur();if(!playing||!x)return;
  var dur=60/x.bpm/4;
  while(nextT<ctx.currentTime+0.12){
    if(step>=x.steps.length)step=0;
    while(x.steps[step].c)step=(step+1)%x.steps.length;var s=x.steps[step],span=s.z?s.z:1;if(s.z){var T=s.z*dur,nn=Math.max(2,Math.round(T/0.04));for(var q=0;q<nn;q++)hit(q%2?(s.h==='d'?'e':'d'):s.h,q===0?s.t:(s.t==='g'?'g':'r'),nextT+q*T/nn)}
    if(!s.z)for(var k=0;k<s.r;k++)hit(s.h,k===0?s.t:(s.t==='g'?'g':'n'),nextT+k*dur/s.r);
    queue.push({i:step,t:nextT});
    nextT+=dur*span;step=(step+span)%x.steps.length;
  }
  timer=setTimeout(tick,25);
}
function draw(){
  if(!playing)return;
  var c=null;while(queue.length&&queue[0].t<=ctx.currentTime)c=queue.shift();
  if(c){app.querySelectorAll('.on').forEach(function(e){e.classList.remove('on')});app.querySelectorAll('[data-s="'+c.i+'"],[data-p="'+c.i+'"]').forEach(function(e){e.classList.add('on')})}
  raf=requestAnimationFrame(draw);
}
function start(){init();playing=true;step=0;queue=[];nextT=ctx.currentTime+0.06;var b=document.getElementById('pl');if(b)b.textContent='Parar';tick();raf=requestAnimationFrame(draw)}
function stop(){playing=false;clearTimeout(timer);cancelAnimationFrame(raf);queue=[];lastOn=null;var b=document.getElementById('pl');if(b)b.textContent='Tocar';app.querySelectorAll('.on').forEach(function(e){e.classList.remove('on')})}

/* ---------- ações ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;
  var a=el.dataset.a;
  if(a==='open'){view={n:'play',id:+el.dataset.id};render()}
  else if(a==='score'){var xx=cur();xx.sc=!xx.sc;save();render()}
  else if(a==='back'){stop();view={n:'list'};render()}
  else if(a==='toggle'){playing?stop():start()}
  else if(a==='new'){view={n:'edit',d:{id:null,name:'Levada '+(L.length+1),m:'4/4',bpm:80,steps:tpl('4/4')}};render()}
  else if(a==='edit'){stop();var x=cur();view={n:'edit',d:JSON.parse(JSON.stringify(x))};render()}
  else if(a==='cancel'){view=view.d.id?{n:'play',id:view.d.id}:{n:'list'};render()}
  else if(a==='meter'){view.d.m=el.dataset.m;view.d.steps=tpl(view.d.m,view.d.steps);norm(view.d.steps,geo(view.d.m).g);view.sel=null;render()}
  else if(a==='note'){view.sel=+el.dataset.i;render()}
  else if(a==='close'){view.sel=null;render()}
  else if(a==='set'){var s=view.d.steps[view.sel],k=el.dataset.k,v=el.dataset.v;if(k==='r'){if(v==='z'){s.r=1;s.z=s.z||1}else{s.r=+v;s.z=0}}else if(k==='z')s.z=+v;else s[k]=v;norm(view.d.steps,geo(view.d.m).g);render()}
  else if(a==='save'){
    var d=view.d;d.name=(d.name||'').trim()||'Sem nome';
    if(d.id){L=L.map(function(x){return x.id===d.id?d:x});view={n:'play',id:d.id}}
    else{d.id=Date.now();L.push(d);view={n:'list'}}
    save();render();
  }
  else if(a==='del'){if(!view.cd){view.cd=true;render();return}L=L.filter(function(x){return x.id!==view.d.id});save();view={n:'list'};render()}
});
render();
})();
</script>
</body>
</html>
